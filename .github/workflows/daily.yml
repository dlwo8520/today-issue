name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: today-issue-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.lock.txt
      - run: python -m ruff check pipeline scripts tests/python
      - run: python -m pytest -q
      - run: npm test
      - run: node --test tests/server/email-gate.test.mjs
      - run: python scripts/build_public.py --mode demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          VITE_DATA_MODE: demo
